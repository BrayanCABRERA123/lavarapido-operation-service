spring:
  # respuestas de error sin mensajes internos ni trazas (en Spring Boot 4 reemplaza a server.error.*)
  web:
    error:
      include-message: never
      include-stacktrace: never
  application:
    name: operations-service
  # En local arranca con dev, salvo que se diga otra cosa con SPRING_PROFILES_ACTIVE.
  profiles:
    default: dev
  # Los secretos van en lavarapido-infra/.env, que no se sube al repositorio. Si este servicio
  # tiene su propio .env, ese gana. Las variables de entorno mandan sobre los dos.
  config:
    import:
      - optional:file:../lavarapido-infra/.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LavaRapido;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # las tablas las crea Liquibase, Hibernate solo revisa que el mapeo cuadre
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        use_nationalized_character_data: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Cada servicio tiene su propia tabla de changelog, porque los seis migran la misma base.
    database-change-log-table: DATABASECHANGELOG_OPERATIONS
    database-change-log-lock-table: DATABASECHANGELOGLOCK_OPERATIONS

  # RabbitMQ (ADR-004): solo se usa con MESSAGING_ENABLED=true
  # fotos del informe de inspeccion: hasta 2 MB cada una y 5 por hallazgo
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 11MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${OPERATIONS_PORT:3004}
  shutdown: graceful

security:
  jwt:
    # El mismo secreto, emisor y audiencia que usa security-service. Este servicio solo revisa
    # el token, no lo emite.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:lavarapido-security-service}
    audience: ${JWT_AUDIENCE:lavarapido-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
  messaging:
    # false: los eventos de ejecucion solo van al log
    enabled: ${MESSAGING_ENABLED:false}
  booking-service:
    # reservas: se leen y se mueven con el token de quien llama (REST, ADR-004)
    base-url: ${BOOKING_SERVICE_URL:http://localhost:3003/api/v1}
    timeout: ${BOOKING_SERVICE_TIMEOUT:3s}
    # sin usuario detrás (asignación automática RF-008, operarios libres RF-010): rutas internas de
    # booking con la llave compartida (no pasan por el gateway)
    internal-url: ${BOOKING_INTERNAL_URL:http://localhost:3003}
    internal-key: ${INTERNAL_API_KEY:}
  # RF-008: al confirmarse una reserva se asigna sola al operario libre (o al que eligió el cliente).
  # false: el administrador asigna a mano, como antes
  auto-assign:
    enabled: ${AUTO_ASSIGN_ENABLED:true}
  # A-12: el operario inicia un servicio desde 15 minutos antes de la hora de la reserva y hasta este
  # tiempo después de la hora de fin (SERVICE_TOO_LATE); pasado eso lo cierra el admin desde "Por cerrar"
  start:
    late-limit: ${START_LATE_LIMIT:PT4H}
  security-service:
    # nombre y contacto de los operarios (solo con token de admin)
    base-url: ${SECURITY_SERVICE_URL:http://localhost:3001/api/v1}
    timeout: ${SECURITY_SERVICE_TIMEOUT:3s}
    # primer nombre de clientes y operarios en las calificaciones: contacto interno de security
    # (no pasa por el gateway) con la misma llave que usa notification-service
    internal-url: ${SECURITY_INTERNAL_URL:http://localhost:3001}
    internal-key: ${INTERNAL_API_KEY:}
  # zona horaria del lavadero: turnos, ausencias y fechas se leen en esta hora
  zone: ${BOOKING_ZONE:America/Bogota}
  # Reservas que terminaron y nadie cerró: sin operario quedan "no asistió" pasado el margen (el mismo
  # de booking-service); con operario quedan "Por cerrar" para el admin y se avisa una vez
  follow-up:
    enabled: ${FOLLOW_UP_ENABLED:true}
    interval: ${FOLLOW_UP_INTERVAL:PT5M}
    grace-minutes: ${BOOKING_EXPIRY_GRACE_MINUTES:60}
    # días hacia atrás que se revisan (el servidor puede pasar semanas apagado); no más de lo que
    # cargan la web y el móvil, o "Por cerrar" no las mostraría
    look-back-days: ${FOLLOW_UP_LOOK_BACK_DAYS:28}

# Swagger apagado por defecto; application-dev.yml lo prende
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    rabbit:
      enabled: ${MESSAGING_ENABLED:false}
  info:
    env:
      enabled: true

info:
  service: operations-service

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
